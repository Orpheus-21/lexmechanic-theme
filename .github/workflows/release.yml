name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check that the tag is the version
        run: python3 scripts/check_manifest.py --tag "$GITHUB_REF_NAME"
      - name: Check that theme.css is up to date
        run: ./build.sh --check
      - name: Write the notes from the changelog
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" manifest.json theme.css --title "$GITHUB_REF_NAME" --notes-file notes.md
